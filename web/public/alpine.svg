<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 520" width="240" height="520" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Cinematic layered alpine night range">
  <defs>
    <!-- night sky: near-black at the top, deepening navy toward the horizon -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04060d" />
      <stop offset="0.34" stop-color="#070c18" />
      <stop offset="0.62" stop-color="#0b1226" />
      <stop offset="1" stop-color="#0a1122" />
    </linearGradient>
    <!-- faint blue-violet aurora band behind the farthest peaks -->
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a5bff" stop-opacity="0" />
      <stop offset="0.45" stop-color="#5b7dff" stop-opacity="0.14" />
      <stop offset="0.72" stop-color="#a273ff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#a273ff" stop-opacity="0" />
    </linearGradient>
    <!-- four depth planes, far (light, hazy) to near (dark) -->
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33477a" />
      <stop offset="1" stop-color="#1a2544" />
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22315a" />
      <stop offset="1" stop-color="#131d38" />
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#152143" />
      <stop offset="1" stop-color="#0c1428" />
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1327" />
      <stop offset="1" stop-color="#060a15" />
    </linearGradient>
    <!-- blue-violet rim light fading down a lit face -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93aaff" stop-opacity="0.95" />
      <stop offset="1" stop-color="#93aaff" stop-opacity="0" />
    </linearGradient>
    <!-- atmospheric fog pooling in the valleys -->
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16223f" stop-opacity="0" />
      <stop offset="0.55" stop-color="#1a2946" stop-opacity="0.35" />
      <stop offset="1" stop-color="#0b1226" stop-opacity="0.1" />
    </linearGradient>
    <radialGradient id="hazeglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b7dff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#5b7dff" stop-opacity="0" />
    </radialGradient>
    <!-- fades to the sidebar chrome at the very base -->
    <linearGradient id="basefade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a15" stop-opacity="0" />
      <stop offset="1" stop-color="#060a15" />
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" />
    </filter>
  </defs>

  <rect width="240" height="520" fill="url(#sky)" />
  <rect y="150" width="240" height="150" fill="url(#aurora)" />
  <ellipse cx="150" cy="250" rx="120" ry="60" fill="url(#hazeglow)" />

  <!-- stars -->
  <g fill="#cdd8ff">
    <circle cx="30" cy="46" r="0.9" opacity="0.7" />
    <circle cx="72" cy="70" r="0.6" opacity="0.45" />
    <circle cx="120" cy="38" r="0.8" opacity="0.6" />
    <circle cx="168" cy="60" r="0.6" opacity="0.4" />
    <circle cx="205" cy="44" r="1" opacity="0.65" />
    <circle cx="214" cy="104" r="0.7" opacity="0.45" />
    <circle cx="52" cy="120" r="0.6" opacity="0.35" />
    <circle cx="96" cy="96" r="0.7" opacity="0.4" />
    <circle cx="146" cy="128" r="0.6" opacity="0.3" />
    <circle cx="188" cy="150" r="0.7" opacity="0.35" />
  </g>

  <!-- plane 1 · far, hazy -->
  <path d="M0 300 L34 258 L64 282 L104 224 L146 268 L186 232 L240 292 L240 520 L0 520 Z" fill="url(#far)" opacity="0.55" filter="url(#soft)" />

  <!-- plane 2 · back -->
  <path d="M0 330 L40 276 L82 312 L128 250 L176 306 L214 268 L240 300 L240 520 L0 520 Z" fill="url(#back)" />
  <path d="M128 250 L176 306 L214 268" fill="none" stroke="url(#rim)" stroke-width="1.3" opacity="0.5" />
  <path d="M128 250 L143 271 L134 275 L151 293 L128 250 Z" fill="#dbe4ff" opacity="0.4" />

  <!-- fog band behind the mid range -->
  <rect y="286" width="240" height="90" fill="url(#fog)" opacity="0.9" />

  <!-- plane 3 · mid -->
  <path d="M0 388 L52 320 L100 366 L150 300 L200 360 L240 322 L240 520 L0 520 Z" fill="url(#mid)" />
  <path d="M150 300 L200 360 L240 322" fill="none" stroke="url(#rim)" stroke-width="1.6" opacity="0.6" />
  <path d="M150 300 L168 326 L157 331 L176 353 L150 300 Z" fill="#cdd8ff" opacity="0.45" />
  <path d="M52 320 L100 366 L150 300" fill="none" stroke="url(#rim)" stroke-width="1.2" opacity="0.35" />

  <!-- valley fog pooling -->
  <ellipse cx="120" cy="416" rx="150" ry="34" fill="#16223f" opacity="0.32" filter="url(#soft)" />

  <!-- plane 4 · near, darkest -->
  <path d="M0 452 L60 384 L120 436 L182 360 L240 424 L240 520 L0 520 Z" fill="url(#near)" />
  <path d="M182 360 L240 424" fill="none" stroke="url(#rim)" stroke-width="1.6" opacity="0.5" />
  <path d="M182 360 L200 386 L189 391 L209 414 L182 360 Z" fill="#cdd8ff" opacity="0.4" />

  <!-- foreground silhouette -->
  <path d="M0 500 L48 452 L96 486 L150 440 L204 482 L240 456 L240 520 L0 520 Z" fill="#05070f" />

  <!-- base fade into the rail -->
  <rect y="430" width="240" height="90" fill="url(#basefade)" />
</svg>
