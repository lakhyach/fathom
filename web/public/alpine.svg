<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 520" width="240" height="520" preserveAspectRatio="xMidYMax slice" role="img" aria-label="Alpine night skyline">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b16" />
      <stop offset="0.55" stop-color="#0a1020" />
      <stop offset="1" stop-color="#0b1226" />
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a5bff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#5b7dff" stop-opacity="0.16" />
      <stop offset="1" stop-color="#a273ff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3a63" />
      <stop offset="1" stop-color="#1a2440" />
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2748" />
      <stop offset="1" stop-color="#121a30" />
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1730" />
      <stop offset="1" stop-color="#0a0f1e" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d97ff" stop-opacity="0.9" />
      <stop offset="1" stop-color="#7d97ff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1226" stop-opacity="0" />
      <stop offset="1" stop-color="#0b1226" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="basefade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f1e" stop-opacity="0" />
      <stop offset="1" stop-color="#0a0f1e" />
    </linearGradient>
  </defs>

  <rect width="240" height="520" fill="url(#sky)" />
  <rect y="150" width="240" height="120" fill="url(#aurora)" />

  <g fill="#cdd8ff">
    <circle cx="34" cy="60" r="0.9" opacity="0.7" />
    <circle cx="150" cy="40" r="0.7" opacity="0.5" />
    <circle cx="200" cy="90" r="1" opacity="0.6" />
    <circle cx="90" cy="110" r="0.6" opacity="0.4" />
    <circle cx="180" cy="150" r="0.7" opacity="0.45" />
    <circle cx="60" cy="180" r="0.6" opacity="0.35" />
    <circle cx="215" cy="210" r="0.8" opacity="0.4" />
  </g>

  <!-- far ridge -->
  <path d="M0 300 L40 250 L70 278 L110 214 L150 262 L190 220 L240 286 L240 520 L0 520 Z" fill="url(#far)" />
  <path d="M110 214 L150 262 L190 220" fill="none" stroke="url(#rim)" stroke-width="1.4" opacity="0.5" />

  <!-- mid ridge -->
  <path d="M0 360 L48 296 L92 344 L140 274 L188 336 L240 292 L240 520 L0 520 Z" fill="url(#mid)" />
  <path d="M140 274 L158 296 L150 300 L166 318 L140 274 Z" fill="#dfe6ff" opacity="0.5" />
  <path d="M48 296 L92 344 L140 274 L188 336 L240 292" fill="none" stroke="url(#rim)" stroke-width="1.6" opacity="0.6" />

  <!-- near ridge -->
  <path d="M0 430 L60 360 L120 414 L176 340 L240 404 L240 520 L0 520 Z" fill="url(#near)" />
  <path d="M176 340 L196 366 L186 372 L206 396 L176 340 Z" fill="#cdd8ff" opacity="0.4" />
  <path d="M60 360 L120 414 L176 340 L240 404" fill="none" stroke="url(#rim)" stroke-width="1.6" opacity="0.55" />

  <!-- valley fog + base fade into the sidebar -->
  <rect y="360" width="240" height="120" fill="url(#fog)" />
  <rect y="420" width="240" height="100" fill="url(#basefade)" />
</svg>
