<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Nunatak">
  <defs>
    <linearGradient id="nk-body" x1="6" y1="9" x2="26" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7fd45f" />
      <stop offset="1" stop-color="#3d8c3a" />
    </linearGradient>
    <radialGradient id="nk-glow" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#67c352" stop-opacity="0.3" />
      <stop offset="1" stop-color="#67c352" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- the app canvas colour, so the tab icon matches the rail surface -->
  <rect width="32" height="32" rx="8" fill="#090e08" />
  <rect width="32" height="32" rx="8" fill="url(#nk-glow)" />
  <!-- alpine ridge: main summit, saddle, secondary peak -->
  <path d="M2.6 26.2 11.6 8.2l4.8 8.9 3.3-5.7 9.7 14.8z" fill="url(#nk-body)" />
  <!-- lit snow cap -->
  <path d="M11.6 8.2 8.7 14.3l2.9-1 2.6 2.1z" fill="#aee762" />
</svg>
